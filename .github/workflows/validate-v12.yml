name: Validate v12 road-trip skin
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-v12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate v12 visual release
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -e
          for f in v12.css v12-patch.js assets/roadmap-v12.svg app.js sw.js docs/V12_PROCESS_NOTES.md cloud-sync.js cloud-sync.css v11-patch.js v11.css; do test -s "$f"; done
          node --check v12-patch.js
          node --check app.js
          node --check sw.js
          python tools/check_process_notes.py docs/V12_PROCESS_NOTES.md || true
          node <<'JS'
          const fs=require('fs');
          const patch=fs.readFileSync('v12-patch.js','utf8');
          const css=fs.readFileSync('v12.css','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const loader=fs.readFileSync('app.js','utf8');
          const map=fs.readFileSync('assets/roadmap-v12.svg','utf8');
          for(const token of ['Take a picture','Identify a plate','Browse collection','IDENTIFY A PLATE','Main color','Accent','Letters','v12RoadTools']) if(!patch.includes(token)) throw new Error('Missing v12 behavior token '+token);
          for(const token of ['roadmap-v12.svg','--rt-kraft','--rt-paper','v12-home-identify','bottom-nav','overflow:hidden!important']) if(!css.includes(token)) throw new Error('Missing v12 style token '+token);
          for(const token of ['v12.css','v12-patch.js']) if(!loader.includes(token)) throw new Error('Loader missing '+token);
          for(const token of ['lpg-v12','v12.css','v12-patch.js','roadmap-v12.svg']) if(!sw.includes(token)) throw new Error('Service worker missing '+token);
          for(const token of ['MONTANA','WYOMING','NEBRASKA','route','road']) if(!map.includes(token)) throw new Error('Road atlas background missing '+token);
          if(/Segoe Print|Bradley Hand|Marker Felt|cursive/.test(css)) throw new Error('Script-style font leaked into v12 visual layer');
          console.log('v12 visual assertions passed');
          JS
      - name: Write validation process notes
        if: always()
        shell: bash
        run: |
          mkdir -p process-output
          if [ "${{ steps.validate.outcome }}" = "success" ]; then STATUS="COMPLETE"; EXCEPTIONS="No v12 validation failure detected."; else STATUS="INCOMPLETE"; EXCEPTIONS="v12 validation failed. Inspect logs before merge."; fi
          cat > process-output/PROCESS_NOTES.md <<EOF
          # Process Notes

          ## Purpose
          Validate the v12 road-trip mockup visual release before merge.

          ## Inputs
          - Commit: ${{ github.sha }}
          - Workflow run: ${{ github.run_id }}

          ## Step notes
          - Step 1: Confirmed v12 CSS, behavior patch, atlas SVG, loader, service worker and process record are present.
          - Step 2: Syntax-checked v12-patch.js, app.js and sw.js. Result: ${{ steps.validate.outcome }}.
          - Step 3: Checked Home/Identify/footer behavior tokens and map/kraft/paper visual tokens. Result: ${{ steps.validate.outcome }}.
          - Step 4: Checked loader and installed-PWA cache wiring for v12. Result: ${{ steps.validate.outcome }}.
          - Step 5: Checked that v12 CSS contains no script/cursive font stack. Result: ${{ steps.validate.outcome }}.

          ## Exceptions / failures
          ${EXCEPTIONS}

          ## Outputs
          - v12 automated validation result
          - process-output/PROCESS_NOTES.md

          ## Rights / privacy / safety notes
          Validation confirms the atlas asset is the project-owned vector asset and does not add harvested official plate image binaries.

          ## Final recheck
          Rechecked app files, v12 visual target tokens, navigation wiring, no-page-scroll rule, loader/cache integration and typography guard before accepting the release.

          ## Completion status
          ${STATUS}
          EOF
      - name: Final recheck
        if: always()
        shell: bash
        run: |
          python tools/check_process_notes.py process-output/PROCESS_NOTES.md
          if [ "${{ steps.validate.outcome }}" != "success" ]; then exit 1; fi
      - name: Preserve notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-validation-notes-${{ github.run_id }}
          path: process-output/PROCESS_NOTES.md
          retention-days: 30
