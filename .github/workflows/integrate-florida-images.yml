name: Integrate pinned Florida FLHSMV 2026 illustrated license plates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/image-batches/florida-trigger.json]
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned PDF image dependencies
        run: pip install 'pymupdf==1.26.7' 'pillow==12.3.0'
      - name: Retrieve archived official Florida 2026 PDF from successful harvest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40408283744 --repo "$GITHUB_REPOSITORY" --name official-plate-harvest-40408283744 --dir private-evidence
          test -s private-evidence/manifest.json
          python - <<'PY'
          import json,pathlib,hashlib
          m=json.loads(pathlib.Path('private-evidence/manifest.json').read_text())
          assert len(m)==4 and all(x['status']=='downloaded' for x in m)
          matches=[x for x in m if x['title']=='Florida License Plate Brochure 2026']
          assert len(matches)==1
          p=pathlib.Path('private-evidence')/matches[0]['file']
          if not p.exists():
              p=pathlib.Path('private-evidence')/str(matches[0]['file']).removeprefix('harvest-output/')
          assert p.is_file(), f"Missing official PDF at {p}"
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='d10418d394fe8d95624cdb932627536c258b4f6272786c38bd68a1a04087834a'
          pathlib.Path('private-evidence/selected-official-florida-pdf-path.txt').write_text(str(p))
          print('Verified 2026 issuing-agency 27-page official PDF, SHA-256 pinned')
          PY
      - name: Match 132 individually reviewed Florida plate samples
        run: |
          set -euo pipefail
          PDF="$(cat private-evidence/selected-official-florida-pdf-path.txt)"
          python tools/integrate_florida_manual.py --pdf "$PDF"
          node --check data/catalog-images.js
          node --check tests/catalog-images.cjs
      - name: Validate 502 catalog examples, 1004 runtime JPEGs and source hashes
        run: |
          set -euo pipefail
          python tools/take_out_trash.py --strict
          python tools/build_runtime.py build/web
          python - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('.')
          selections=json.loads((root/'data/catalog-images.js').read_text().removeprefix('globalThis.LPG_CATALOG_IMAGES=').strip().rstrip(';'))
          rows=json.loads((root/'database/image-reconciliation-fl-20261026.json').read_text())
          assert len(selections)==502 and len(rows)==132 and len({r['uid'] for r in rows})==132
          assert sum(uid.startswith('LPG-US-FL-') for uid in selections)==132
          assert len(list((root/'build/web/assets/plates').glob('*.jpg')))==1004
          for row in rows:
              uid=row['uid']
              assert selections[uid]['match_status']=='source_matched'
              assert selections[uid]['era_status']=='unverified' and selections[uid]['human_approval'] is False
              for kind in ('display','thumbnail'):
                  path=root/'assets/plates'/f'{uid}-{kind}.jpg'
                  assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==row[f'{kind}_sha256']
                  assert (root/'build/web/assets/plates'/path.name).is_file()
          assert (root/'sw.js').read_text().count('lpg-current-images-20261026-fl')==1
          print('PASS: 132 Florida UIDs, source hashes, 264 JPEGs, 502 selections, offline staged 1004')
          PY
      - name: Record complete process notes with exceptions
        run: |
          cat > docs/IMAGE_FL_2026_INTEGRATION_PROCESS_NOTES.md <<'EOF'
          # Process Notes — 132 source-matched Florida sample plates

          ## Purpose
          Integrate all 132 currently catalogued Florida plate designs as independent source-matched samples from the exact 2026 official FLHSMV illustrated brochure. Do not grant human approval, copyright rights or verified historical years.

          ## Inputs
          Official issuing-agency source `https://www.flhsmv.gov/pdf/specialtyplates/Florida%20License%20Plate%20Brochure%20%28Revised%201-2026%29%20reduced%20size.pdf`, 27-page SHA-256 `d10418d394fe8d95624cdb932627536c258b4f6272786c38bd68a1a04087834a`; pinned mappings `data/image-batches/florida-manual-reviewed-20261026.json`; original source harvest run 40408283744 (artifact official-plate-harvest-40408283744); 1,138 canonical UIDs and 370 previously selected sources.

          ## Step notes
          - Step 1: downloaded official frozen source archive generated by prior Actions harvest and verified both archive source record and document SHA-256.
          - Step 2: verified all 132 distinct frozen Florida UIDs, each canonical name, PDF page, embedded xref/rectangle, and individual embedded-image source SHA-256.
          - Step 3: retained distinct standard In God We Trust and passenger Blue Angels plate samples; resolved two split collegiate source captions by individual page/plate inspection.
          - Step 4: converted 132 embedded official sample images to aspect-preserving, non-upscaled 800px/300px maximal JPEG representations without inventing new artwork or text.
          - Step 5: staged 264 new JPEG derivatives while preserving all 740 previous runtime JPEGs and all 370 previous source selections.
          - Step 6: validated 502 selected UIDs of 1,138 existing catalog entries, 1004 staged JPGs, hashes, offline SW cache version, app manifest JS syntax and strict repository Trash audit.
          - Step 7: prepared reviewed image result on an isolated generated GitHub branch with its own PR gate, not an automatically deployed branch or Android stable release.

          ## Exceptions / failures
          Visual source position correspondence, sampled contact-sheet inspection and cryptographic source hashes establish reviewed source matching only, not design issue-year proof or formal human approval. Private original Florida PDFs remain only in the Library/Actions evidence package. The user-directed fair-use rationale is not a source-specific image license or legal judgment. Physical Android signed upgrade, data persistence and updater acceptance remain unverified.

          ## Outputs
          132 new Florida sample pairs (264 JPEGs) in assets/plates; 502 total `data/catalog-images.js` mappings; `database/image-reconciliation-fl-20261026.json`; incremented `sw.js` cache and browser image regression; generated review branch only.

          ## Rights / privacy notes
          No original PDF source, private keys, user-specific plate photographs or personal registration data are committed. Agency citation and source SHA metadata are preserved separately from legal review statuses.

          ## Final recheck
          Checked exact document SHA, 132 unique mapped source image hashes and PDF positions, 502 selection count, 264 new+740 prior JPEGs, UID/name invariants, all derivative hashes, CI strict audit and stage inclusion. Physical Android release and human era/rights reviews remain open.

          ## Completion status
          COMPLETE_WITH_EXCEPTIONS
          EOF
          python tools/check_process_notes.py docs/IMAGE_FL_2026_INTEGRATION_PROCESS_NOTES.md
      - name: Commit only generated image candidates to separate review branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c generated/florida-132-source-images-20261026
          git add assets/plates data/catalog-images.js database/image-reconciliation-fl-20261026.json sw.js tests/catalog-images.cjs docs/IMAGE_FL_2026_INTEGRATION_PROCESS_NOTES.md
          git diff --cached --quiet && { echo 'No image candidates produced'; exit 1; }
          git commit -m 'Integrate 132 official Florida sample plate images under source-match review'
          git push origin HEAD:refs/heads/generated/florida-132-source-images-20261026
          echo 'Review branch created; no signed Android release or direct publication.'
