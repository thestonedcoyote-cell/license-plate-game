name: Build Android APK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Audit and stage bundled web app
        run: |
          python tools/take_out_trash.py --strict
          python tools/build_runtime.py android-app/app/src/main/assets/www
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        run: gradle -p android-app :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: license-plate-game-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
