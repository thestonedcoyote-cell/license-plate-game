name: Validate v13.0.3 screenshot repair
on:
  pull_request:
    paths:
      - 'v13.0.3.css'
      - 'v13.0.3-patch.js'
      - 'app.js'
      - 'sw.js'
      - 'docs/V13_0_3_PROCESS_NOTES.md'
      - '.github/workflows/validate-v13-0-3.yml'
  push:
    branches: [main]
    paths:
      - 'v13.0.3.css'
      - 'v13.0.3-patch.js'
      - 'app.js'
      - 'sw.js'
      - 'docs/V13_0_3_PROCESS_NOTES.md'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify screenshot repair
        shell: bash
        run: |
          set -euo pipefail
          test -s v13.0.3.css
          test -s v13.0.3-patch.js
          grep -q "paper-kraft-card-v13.svg" v13.0.3.css
          grep -q "paper-notebook-card-v13.svg" v13.0.3.css
          grep -q "mask:none" v13.0.3.css
          grep -q "Rebuild Home" v13.0.3-patch.js
          grep -q "Home</button>" v13.0.3-patch.js
          grep -q "Identify</button>" v13.0.3-patch.js
          grep -q "Camera</button>" v13.0.3-patch.js
          grep -q "Collection</button>" v13.0.3-patch.js
          grep -q "More</button>" v13.0.3-patch.js
          grep -q "v13.0.3.css" app.js
          grep -q "v13.0.3-patch.js" app.js
          grep -q "lpg-v13-0-3-2026-09-07" sw.js
          grep -q "v13.0.3.css" sw.js
          grep -q "v13.0.3-patch.js" sw.js
          node --check v13.0.3-patch.js
          node --check app.js
      - name: Verify process notes
        shell: bash
        run: |
          set -euo pipefail
          f=docs/V13_0_3_PROCESS_NOTES.md
          test -s "$f"
          grep -q '^## Purpose' "$f"
          grep -q '^## Inputs' "$f"
          grep -q '^## Step notes' "$f"
          grep -q '^## Exceptions / failures' "$f"
          grep -q '^## Outputs' "$f"
          grep -q '^## Rights / privacy / safety notes' "$f"
          grep -q '^## Final recheck' "$f"
          grep -q '^## Completion status' "$f"
