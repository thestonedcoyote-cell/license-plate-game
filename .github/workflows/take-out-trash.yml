name: Take out the trash
on:
  pull_request:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run trash audit
        run: |
          mkdir -p build
          python tools/take_out_trash.py --strict --report build/TRASH_AUDIT.md
          python tools/build_runtime.py build/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: trash-audit
          path: build/TRASH_AUDIT.md
