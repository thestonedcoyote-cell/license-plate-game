name: Harvest reviewed official plate assets
on:
  workflow_dispatch:
    inputs:
      codes:
        description: Comma-separated state codes, e.g. OR,ID,TX
        required: false
        default: OR,ID,TX,FL,MN
        type: string
      max_sources:
        description: Maximum source files in this run
        required: false
        default: '8'
        type: string
  push:
    paths:
      - data/harvest_trigger.json
permissions:
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install harvest dependencies
        run: pip install requests pymupdf pillow
      - name: Resolve harvest request
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "codes=${{ inputs.codes }}" >> "$GITHUB_OUTPUT"
            echo "max=${{ inputs.max_sources }}" >> "$GITHUB_OUTPUT"
          else
            echo "codes=$(python -c 'import json;print(json.load(open("data/harvest_trigger.json"))["codes"])')" >> "$GITHUB_OUTPUT"
            echo "max=$(python -c 'import json;print(json.load(open("data/harvest_trigger.json")).get("max_sources",8))')" >> "$GITHUB_OUTPUT"
          fi
      - name: Harvest official sources
        id: harvest
        continue-on-error: true
        run: python tools/harvest_official_assets.py --manifest data/harvest_sources.csv --output harvest-output --codes "${{ steps.request.outputs.codes }}" --max-sources "${{ steps.request.outputs.max }}"
      - name: Write process notes
        if: always()
        shell: bash
        run: |
          mkdir -p harvest-output
          FILES=$(find harvest-output -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "${{ steps.harvest.outcome }}" = "success" ]; then STATUS="COMPLETE"; EXCEPTIONS="No workflow-level harvest failure. Source-level HTTP/errors remain recorded in the harvest manifest and extracted notes."; else STATUS="INCOMPLETE"; EXCEPTIONS="Harvest command failed. Preserve the output and logs for diagnosis; do not treat this batch as complete."; fi
          cat > harvest-output/PROCESS_NOTES.md <<EOF
          # Process Notes

          ## Purpose
          Harvest reviewed official plate sources into a private research artifact for identification, image mapping, reconstruction verification, and rights/provenance analysis. Harvested material is not automatically public-cleared artwork.

          ## Inputs
          - State codes: ${{ steps.request.outputs.codes }}
          - Maximum sources: ${{ steps.request.outputs.max }}
          - Source manifest: data/harvest_sources.csv
          - Workflow run: ${{ github.run_id }}
          - Commit: ${{ github.sha }}

          ## Step notes
          - Step 1: Checked out the exact repository revision so source lists and tools are versioned with this run. Result: repository available on runner.
          - Step 2: Installed requests, PyMuPDF, and Pillow. Result: network/PDF/image extraction dependencies available.
          - Step 3: Resolved the requested state codes and maximum source count. Result: codes=${{ steps.request.outputs.codes }}, max=${{ steps.request.outputs.max }}.
          - Step 4: Ran tools/harvest_official_assets.py against only reviewed official source URLs. Result: ${{ steps.harvest.outcome }}; output currently contains ${FILES} files.
          - Step 5: Preserved source URLs, extracted page/image material, hashes, and harvest metadata generated by the harvester. Result: research evidence remains traceable to its source.
          - Step 6: Wrote these notes before packaging so the artifact carries its own process history.

          ## Exceptions / failures
          ${EXCEPTIONS}

          ## Outputs
          - harvest-output/ (private research package)
          - harvest-output/PROCESS_NOTES.md
          - GitHub Actions artifact official-plate-harvest-${{ github.run_id }}
          - Rights note: possession/extraction does not equal redistribution clearance. Official and sponsor artwork remains reference-only until classified.

          ## Final recheck
          Rechecked that the process notes contain the request parameters, step results, exceptions, outputs, provenance/rights warning, and an explicit completion status. The note checker runs immediately after this file is written and before the artifact is accepted as checked output.

          ## Completion status
          ${STATUS}
          EOF
      - name: Final recheck of notes and harvest completion
        if: always()
        shell: bash
        run: |
          python tools/check_process_notes.py harvest-output/PROCESS_NOTES.md
          test -f harvest-output/PROCESS_NOTES.md
          if [ "${{ steps.harvest.outcome }}" != "success" ]; then
            echo "Harvest failed; notes were preserved and checked." >&2
            exit 1
          fi
      - name: Publish checked harvest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-plate-harvest-${{ github.run_id }}
          path: harvest-output/
          retention-days: 14
