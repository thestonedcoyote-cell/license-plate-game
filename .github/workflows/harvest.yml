name: Harvest reviewed official plate assets
on:
  workflow_dispatch:
    inputs:
      codes:
        description: Comma-separated state codes, e.g. OR,ID,TX
        required: false
        default: OR,ID,TX,FL,MN
        type: string
      max_sources:
        description: Maximum source files in this run
        required: false
        default: '8'
        type: string
  push:
    paths:
      - data/harvest_trigger.json
permissions:
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install harvest dependencies
        run: pip install requests pymupdf pillow beautifulsoup4
      - name: Resolve harvest request
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "codes=${{ inputs.codes }}" >> "$GITHUB_OUTPUT"
            echo "max=${{ inputs.max_sources }}" >> "$GITHUB_OUTPUT"
          else
            echo "codes=$(python -c 'import json;print(json.load(open("data/harvest_trigger.json"))["codes"])')" >> "$GITHUB_OUTPUT"
            echo "max=$(python -c 'import json;print(json.load(open("data/harvest_trigger.json")).get("max_sources",8))')" >> "$GITHUB_OUTPUT"
          fi
      - name: Harvest official sources
        id: harvest
        continue-on-error: true
        run: python tools/harvest_official_assets.py --manifest data/harvest_sources.csv --output harvest-output --codes "${{ steps.request.outputs.codes }}" --max-sources "${{ steps.request.outputs.max }}"
      - name: Write process notes
        if: always()
        shell: bash
        run: |
          mkdir -p harvest-output
          FILES=$(find harvest-output -type f 2>/dev/null | wc -l | tr -d ' ')
          SOURCES=$(python -c 'import json,pathlib; p=pathlib.Path("harvest-output/manifest.json"); print(len(json.loads(p.read_text())) if p.exists() else 0)')
          ERRORS=$(python -c 'import json,pathlib; p=pathlib.Path("harvest-output/manifest.json"); d=json.loads(p.read_text()) if p.exists() else []; print(sum(x.get("status")=="error" for x in d))')
          if [ "${{ steps.harvest.outcome }}" = "success" ]; then STATUS="COMPLETE"; EXCEPTIONS="Workflow command completed. Source-level HTTP, extraction, duplicate, and non-image exceptions remain recorded in manifest.json/assets.json. Sources with status=error: ${ERRORS}."; else STATUS="INCOMPLETE"; EXCEPTIONS="Harvest command failed. Preserve output and logs for diagnosis; do not treat this batch as complete."; fi
          cat > harvest-output/PROCESS_NOTES.md <<EOF
          # Process Notes

          ## Purpose
          Harvest reviewed official plate PDF, direct-image, and HTML-gallery sources into a private research artifact for identification, mapping, reconstruction verification, and rights/provenance analysis. Harvested material is not automatically public-cleared artwork.

          ## Inputs
          - State codes: ${{ steps.request.outputs.codes }}
          - Maximum sources: ${{ steps.request.outputs.max }}
          - Source manifest: data/harvest_sources.csv
          - Workflow run: ${{ github.run_id }}
          - Commit: ${{ github.sha }}

          ## Step notes
          - Step 1: Checked out the exact repository revision so source lists and tools are versioned with this run. Result: repository available on runner.
          - Step 2: Installed requests, PyMuPDF, Pillow, and BeautifulSoup. Result: network, PDF, image, and reviewed-HTML-gallery extraction dependencies available.
          - Step 3: Resolved requested state codes and maximum source count. Result: codes=${{ steps.request.outputs.codes }}, max=${{ steps.request.outputs.max }}.
          - Step 4: Ran tools/harvest_official_assets.py against only URLs listed in the reviewed source manifest. HTML mode downloads image assets directly referenced by the reviewed page but does not crawl arbitrary external pages. Result: ${{ steps.harvest.outcome }}.
          - Step 5: Counted ${SOURCES} attempted source records, ${ERRORS} source-level errors, and ${FILES} output files after extraction.
          - Step 6: Preserved URLs, page/image assets, alt text where available, dimensions, source/asset host relationship, hashes, and extraction metadata. Result: research evidence remains traceable to the official source page.
          - Step 7: Wrote these notes before packaging so the artifact carries its own process history.

          ## Exceptions / failures
          ${EXCEPTIONS}

          ## Outputs
          - harvest-output/ private research package
          - harvest-output/manifest.json
          - per-gallery assets.json/source.html/source.txt when HTML extraction is used
          - harvest-output/PROCESS_NOTES.md
          - GitHub Actions artifact official-plate-harvest-${{ github.run_id }}
          - Rights note: official embedding is provenance evidence, not automatic redistribution clearance. Sponsor/third-party art remains reference-only until classified.

          ## Final recheck
          Rechecked request parameters, source/error counts, output existence, provenance fields, rights warning, exceptions, step notes, and completion status. The note checker runs immediately after this file is written and before the artifact is accepted as checked output.

          ## Completion status
          ${STATUS}
          EOF
      - name: Final recheck of notes and harvest completion
        if: always()
        shell: bash
        run: |
          python tools/check_process_notes.py harvest-output/PROCESS_NOTES.md
          test -s harvest-output/manifest.json
          if [ "${{ steps.harvest.outcome }}" != "success" ]; then
            echo "Harvest failed; notes were preserved and checked." >&2
            exit 1
          fi
      - name: Publish checked harvest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-plate-harvest-${{ github.run_id }}
          path: harvest-output/
          retention-days: 14
