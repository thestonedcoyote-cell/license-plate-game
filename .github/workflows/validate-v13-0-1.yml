name: Validate v13.0.1 paper layers
on:
  pull_request:
    paths:
      - 'v13.0.1.css'
      - 'app.js'
      - 'sw.js'
      - 'docs/V13_0_1_PROCESS_NOTES.md'
      - '.github/workflows/validate-v13-0-1.yml'
  push:
    branches: [main]
    paths:
      - 'v13.0.1.css'
      - 'app.js'
      - 'sw.js'
      - 'docs/V13_0_1_PROCESS_NOTES.md'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify hotfix paper assets and layering
        shell: bash
        run: |
          set -euo pipefail
          test -s v13.0.1.css
          grep -q "paper-kraft-strip-v13.svg" v13.0.1.css
          grep -q "paper-kraft-card-v13.svg" v13.0.1.css
          grep -q "paper-white-card-v13.svg" v13.0.1.css
          grep -q "paper-notebook-card-v13.svg" v13.0.1.css
          grep -q "paper-yellow-card-v13.svg" v13.0.1.css
          grep -q "paper-crumple-overlay-v13.svg" v13.0.1.css
          grep -q "mask-image" v13.0.1.css
          grep -q "isolation:isolate" v13.0.1.css
          grep -q "v13.0.1.css" app.js
          grep -q "lpg-v13-0-1-2026-09-07" sw.js
          grep -q "v13.0.1.css" sw.js
          for f in assets/paper-kraft-strip-v13.svg assets/paper-kraft-card-v13.svg assets/paper-white-card-v13.svg assets/paper-notebook-card-v13.svg assets/paper-yellow-card-v13.svg assets/paper-crumple-overlay-v13.svg; do test -s "$f"; done
      - name: Verify process notes
        shell: bash
        run: |
          set -euo pipefail
          f=docs/V13_0_1_PROCESS_NOTES.md
          test -s "$f"
          grep -q '^## Purpose' "$f"
          grep -q '^## Inputs' "$f"
          grep -q '^## Step notes' "$f"
          grep -q '^## Exceptions / failures' "$f"
          grep -q '^## Outputs' "$f"
          grep -q '^## Rights / privacy / safety notes' "$f"
          grep -q '^## Final recheck' "$f"
          grep -q '^## Completion status' "$f"
