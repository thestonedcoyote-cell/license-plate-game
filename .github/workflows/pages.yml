name: Deploy Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - data/harvest_trigger.json
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release files and JavaScript
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -e
          for f in index.html styles.css v8.css v9.css v10.css app.js v8-patch.js v10-patch.js sw.js manifest.webmanifest icon.svg data/reference-renders-v10.js data/catalog.part0.b64 data/catalog.part1.b64 data/catalog.part2.b64 data/catalog.part3.b64 data/catalog.part4.b64 docs/V10_PROCESS_NOTES.md docs/V10_IMAGE_RELEASE_NOTES.md; do test -s "$f"; done
          node --check app.js
          node --check v8-patch.js
          node --check v10-patch.js
          node --check data/reference-renders-v10.js
          node --check sw.js
          grep -q "lpg-v10" sw.js
          grep -q "v10.css" sw.js
          grep -q "v10-patch.js" sw.js
          grep -q "reference-renders-v10.js" sw.js
          node <<'JS'
          const fs=require('fs'),vm=require('vm');const ctx={window:{}};vm.createContext(ctx);vm.runInContext(fs.readFileSync('data/reference-renders-v10.js','utf8'),ctx);
          if(Object.keys(ctx.window.LPG_R||{}).length!==130)throw new Error('Public reference-render count is not 130');
          const p=fs.readFileSync('v10-patch.js','utf8');for(const s of ['LPG 000','REF','Identify this photo','attached-photo','lpg-camera-mode'])if(!p.includes(s))throw new Error(`Missing ${s}`);
          JS
          python tools/check_process_notes.py docs/V10_PROCESS_NOTES.md
          python tools/check_process_notes.py docs/V10_IMAGE_RELEASE_NOTES.md
      - name: Write deployment process notes
        if: always()
        shell: bash
        run: |
          mkdir -p process-output
          if [ "${{ steps.verify.outcome }}" = "success" ]; then STATUS="COMPLETE"; EXCEPTIONS="No release-validation failure detected."; else STATUS="INCOMPLETE"; EXCEPTIONS="Release validation failed. Deployment must not be accepted as complete; inspect the workflow logs."; fi
          cat > process-output/PROCESS_NOTES.md <<EOF
          # Process Notes

          ## Purpose
          Validate and publish the v10 License Plate Game PWA to GitHub Pages while preserving an auditable note of what was checked.

          ## Inputs
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Workflow run: ${{ github.run_id }}
          - Deployment target: GitHub Pages

          ## Step notes
          - Step 1: Checked out the exact source revision. Result: deployment input fixed to commit ${{ github.sha }}.
          - Step 2: Verified required PWA/catalog/v10 notebook/reference-render files are present and non-empty. Result: ${{ steps.verify.outcome }}.
          - Step 3: Ran JavaScript syntax checks for the core app, compatibility patch, v10 photo/render patch, reference manifest, and service worker. Result: ${{ steps.verify.outcome }}.
          - Step 4: Reconciled 130 public reference renders and checked fictitious serial/REF, fixed-camera/photo-to-identify hooks, and v10 cache references. Result: ${{ steps.verify.outcome }}.
          - Step 5: Checked v10 process/image-release notes with the process-note validator. Result: ${{ steps.verify.outcome }}.
          - Step 6: Wrote these process notes before packaging/deployment.

          ## Exceptions / failures
          ${EXCEPTIONS}

          ## Outputs
          - Checked static PWA source tree
          - GitHub Pages deployment artifact (only if final recheck succeeds)
          - process-output/PROCESS_NOTES.md retained as a workflow artifact

          ## Final recheck
          Rechecked required app files, JavaScript syntax, 130 clean reference-render count, reference-render safety tokens, fixed camera/photo-to-identify hooks, v10 service-worker cache references, and the completeness of these notes. Deployment is permitted only when validation and the note checker pass.

          ## Completion status
          ${STATUS}
          EOF
      - name: Final recheck before publication
        if: always()
        shell: bash
        run: |
          python tools/check_process_notes.py process-output/PROCESS_NOTES.md
          if [ "${{ steps.verify.outcome }}" != "success" ]; then exit 1; fi
      - name: Preserve deployment notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-process-notes-${{ github.run_id }}
          path: process-output/PROCESS_NOTES.md
          retention-days: 30
      - name: Remove private process artifact from public site package
        if: success()
        run: rm -rf process-output
      - uses: actions/configure-pages@v5
        if: success()
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: .
      - name: Deploy checked release
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
