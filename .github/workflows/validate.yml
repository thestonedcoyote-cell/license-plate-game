name: Validate app
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate current runtime
        run: |
          python tools/take_out_trash.py --strict
          python tools/build_runtime.py build/web
          node --check app.js
          node --check ui-current.js
          node --check cloud-sync.js
          test -s build/web/index.html
          grep -q 'ui-current.css' app.js
          grep -q 'ui-current.js' app.js
          grep -q 'lpg-current-' sw.js
