name: Validate app
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app package and tools
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -e
          for f in index.html styles.css v8.css v9.css v10.css v11.css app.js v8-patch.js v10-patch.js v11-patch.js sw.js manifest.webmanifest icon.svg data/reference-renders-v10.js data/reference-renders-tx-v10.1.js data/catalog.part0.b64 data/catalog.part1.b64 data/catalog.part2.b64 data/catalog.part3.b64 data/catalog.part4.b64 docs/PROCESS_STANDARD.md docs/V11_PROCESS_NOTES.md docs/CLOUD_SYNC_FOUNDATION.md; do test -s "$f"; done
          node --check app.js
          node --check v8-patch.js
          node --check v10-patch.js
          node --check v11-patch.js
          node --check sw.js
          node --check data/reference-renders-v10.js
          node --check data/reference-renders-tx-v10.1.js
          python -m py_compile tools/*.py
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('data/reference-renders-v10.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('data/reference-renders-tx-v10.1.js','utf8'),ctx);
          const keys=Object.keys(ctx.window.LPG_R||{});
          if(keys.length!==291)throw new Error(`Expected 291 combined public reference renders, got ${keys.length}`);
          if(new Set(keys).size!==keys.length)throw new Error('Duplicate public render UID');
          const patch=fs.readFileSync('v11-patch.js','utf8'),css=fs.readFileSync('v11.css','utf8'),sw=fs.readFileSync('sw.js','utf8'),loader=fs.readFileSync('app.js','utf8');
          for(const token of ['Main background','Second color','Letters','No wall of rectangles','researchResults','pendingPhotoBanner','catalog.part4.b64'])if(!patch.includes(token))throw new Error(`Missing v11 behavior token: ${token}`);
          for(const token of ['overflow:hidden!important','research-results','v11-results','--v11-kraft','repeating-linear-gradient'])if(!css.includes(token))throw new Error(`Missing v11 layout token: ${token}`);
          for(const token of ['v11.css','v11-patch.js','reference-renders-tx-v10.1.js'])if(!sw.includes(token))throw new Error(`Missing baseline cache token: ${token}`);
          for(const token of ['v11.css','v11-patch.js','reference-renders-tx-v10.1.js'])if(!loader.includes(token))throw new Error(`Loader missing ${token}`);
          console.log(`baseline assertions passed; ${keys.length} combined public reference renders`);
          JS
          python tools/check_process_notes.py docs/V11_PROCESS_NOTES.md
      - name: Write validation process notes
        if: always()
        shell: bash
        run: |
          mkdir -p process-output
          if [ "${{ steps.validate.outcome }}" = "success" ]; then STATUS="COMPLETE"; EXCEPTIONS="No validation failure detected."; else STATUS="INCOMPLETE"; EXCEPTIONS="Validation failed. Inspect logs and do not merge until corrected."; fi
          cat > process-output/PROCESS_NOTES.md <<EOF
          # Process Notes

          ## Purpose
          Validate the stable app baseline, catalog/render assets, process-note rules and loader/service-worker integration before merge.

          ## Inputs
          - Commit: ${{ github.sha }}
          - Ref: ${{ github.ref }}
          - Workflow run: ${{ github.run_id }}

          ## Step notes
          - Step 1: Checked out the proposed repository revision.
          - Step 2: Confirmed required baseline UI layers, app, service worker, reference-render files, catalog chunks and process documentation exist and are non-empty. Result: ${{ steps.validate.outcome }}.
          - Step 3: Syntax-checked app.js, baseline patches, render manifests and sw.js with Node. Result: ${{ steps.validate.outcome }}.
          - Step 4: Compiled Python tooling with py_compile. Result: ${{ steps.validate.outcome }}.
          - Step 5: Reconciled exactly 291 combined public render UIDs. Result: ${{ steps.validate.outcome }}.
          - Step 6: Checked baseline Identify, Research, photo-target, internal-scrolling and loader/cache wiring. Result: ${{ steps.validate.outcome }}.
          - Step 7: Ran the process-note checker against the v11 implementation record. Result: ${{ steps.validate.outcome }}.

          ## Exceptions / failures
          ${EXCEPTIONS}

          ## Outputs
          - Automated baseline validation result
          - process-output/PROCESS_NOTES.md

          ## Final recheck
          Rechecked required files, JavaScript/Python syntax, 291-render reconciliation, baseline no-page-scroll/internal-scroll rules, color-first Identify, Research, photo target, service-worker cache and process-note completeness. A failing validation is not complete work.

          ## Completion status
          ${STATUS}
          EOF
      - name: Final recheck before accepting validation
        if: always()
        shell: bash
        run: |
          python tools/check_process_notes.py process-output/PROCESS_NOTES.md
          if [ "${{ steps.validate.outcome }}" != "success" ]; then exit 1; fi
      - name: Preserve validation notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-notes-${{ github.run_id }}
          path: process-output/PROCESS_NOTES.md
          retention-days: 30
