name: Integrate inspected California and Wisconsin plate examples
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/image-batches/ca-wi-trigger.json]
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install image libraries
        run: pip install pillow
      - name: Recover original official-source evidence
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh run download 40386466698 --repo "$GITHUB_REPOSITORY" --name official-plate-harvest-40386466698 --dir private-evidence
          test -s private-evidence/manifest.json
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path("private-evidence");x=json.loads((p/"manifest.json").read_text())
          assert len(x)==4 and all(r["status"]=="downloaded" for r in x)
          print("Official gallery source status CA/NV/WI/IN:",[(r['code'],sum(q.get('status')=='downloaded' for q in r['gallery']['records'])) for r in x])
          PY
      - name: Integrate 64 explicit inspected plate samples
        run: |
          python tools/integrate_ca_wi_gallery.py --evidence-dir private-evidence
          node --check data/catalog-images.js
          node --check tests/catalog-images.cjs
      - name: Verify source selections in application runtime
        run: |
          python tools/take_out_trash.py --strict
          python tools/build_runtime.py build/web
          python - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('.')
          manifest=json.loads((root/'data/catalog-images.js').read_text().strip().removeprefix('globalThis.LPG_CATALOG_IMAGES=').rstrip(';'))
          r=json.loads((root/'database/image-reconciliation-ca-wi-20261026.json').read_text())
          assert len(manifest)==370 and len(r['selections'])==64
          assert sum(k.startswith('LPG-US-CA-') for k in manifest)==33
          assert sum(k.startswith('LPG-US-WI-') for k in manifest)==31
          assert 'LPG-US-WI-00007' not in manifest
          assert len(list((root/'assets/plates').glob('*.jpg')))==740
          assert len(list((root/'build/web/assets/plates').glob('*.jpg')))==740
          for x in r['selections']:
              uid=x['uid']
              assert manifest[uid]['source_sha256']==x['source_sha256']
              assert manifest[uid]['human_approval'] is False
              assert manifest[uid]['era_status']=='unverified'
              for k in ('display','thumbnail'):
                  p=root/f'assets/plates/{uid}-{k}.jpg'
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==x[f'{k}_sha256']
                  assert (root/'build/web/assets/plates'/p.name).exists()
          print('PASS: 64 official CA/WI source images; 128 hashed JPEGs; 370 selected; 740 offline images')
          PY
      - name: Record process notes
        run: |
          cat > docs/IMAGE_CA_WI_INTEGRATION_20261026_PROCESS_NOTES.md <<'EOF'
          # Process Notes — California and Wisconsin image batch October 26, 2026

          ## Purpose
          Add 64 independently inspected issuing-agency license plate samples to immutable catalog UIDs, preserving original hashes and unresolved matches.

          ## Inputs
          Official CA DMV and WI DOT plate galleries harvested by GitHub run 40386466698, stored as 2026-10-26 private evidence. Exact UID/asset source pairs in data/image-batches/ca-wi-reviewed-map.txt. Prior 306 official sample selections, 1,138 immutable catalog UIDs.

          ## Step notes
          - Step 1: restored the complete original-source artifact with issuing-agency HTML and original plate images plus hashes.
          - Step 2: enforced exactly 33 CA and 31 WI manually reviewed UID/source-file associations.
          - Step 3: verified original source file SHA-256 against the archived harvest manifest before creating JPEGs, and rejected absent/malformed labels or images.
          - Step 4: explicitly excluded Wisconsin Civil Air Patrol because its official label points at unrelated Spay/Neuter/Adopt artwork.
          - Step 5: created 64 display and 64 thumbnail aspect-preserving JPEGs without upscaling.
          - Step 6: expanded the game source image manifest from 306 to 370 examples, offline cache from 612 to 740 JPEGs, and browser regression for California/Wisconsin.
          - Step 7: validated all 128 output hashes, 64 unique catalog IDs, web runtime build, offline manifest version, strict Trash audit and JS syntax.
          - Step 8: prepared image candidates on a review branch only; main website and signed APK release await separate approval/tests.

          ## Exceptions / failures
          Other California and Wisconsin gallery photos remain excluded when identity or variant is unclear. One original California asset request failed in the harvest, and Nevada (115 downloaded images) and Indiana (2 downloaded images) are not covered by this integration. There is no approval of historical issue era, source license, legal fair-use conclusion, human final visual verification, or signed Android on-device upgrade.

          ## Outputs
          64 new source-matched selections, 128 JPEG derivatives, 370 cumulative image selections, and database/image-reconciliation-ca-wi-20261026.json with source labels/files/original hashes and image derivatives. Private source archive Library libfile_01707d71188c819192f9c43b2b535279.

          ## Rights / privacy notes
          Do not place wholesale original galleries, private credentials, device registrations or raw unrelated material in the public app package. Attribute original government source pages and keep project fair-use basis separately from source-license status.

          ## Final recheck
          Checked 306+64=370 unique selections, 1138-370=768 unmatched UIDs, 740 offline JPEG files, all 128 derivative SHA-256 hashes, no Wisconsin Civil Air Patrol incorrect match, and staged runtime files. Physical Android upgrade and human review remain separate tasks.

          ## Completion status
          COMPLETE_WITH_EXCEPTIONS
          EOF
          python tools/check_process_notes.py docs/IMAGE_CA_WI_INTEGRATION_20261026_PROCESS_NOTES.md
      - name: Commit generated images only to review branch
        run: |
          set -euo pipefail
          REF=generated/california-wisconsin-64-source-images-20261026
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$REF"
          git add assets/plates data/catalog-images.js sw.js tests/catalog-images.cjs database/image-reconciliation-ca-wi-20261026.json docs/IMAGE_CA_WI_INTEGRATION_20261026_PROCESS_NOTES.md
          git diff --cached --quiet && { echo "No assets generated"; exit 1; }
          git commit -m "Stage 64 CA WI official plate design samples with provenance"
          git push origin "HEAD:refs/heads/$REF"
          echo "Generated review branch. No stable signed Android release."
